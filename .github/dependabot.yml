version: 2
# Each ecosystem's updates come as one PR a week, so main builds one image per round, not one per bump.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Patch updates only: a new Python minor means bumping CI's and the venv's Python too, deliberately.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A week before taking a new Action release: a hijacked one runs with CI's token and is usually caught by then.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
